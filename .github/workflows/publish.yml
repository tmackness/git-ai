name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Configure git (needed for git integration tests)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Bot"
          git config --global init.defaultBranch main

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Verify version matches release tag
        if: github.event_name == 'release'
        run: |
          PKG_NAME="$(node -p "require('./package.json').name.split('/').pop()")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PKG_VERSION}"
          EXPECTED_COMPONENT_TAG="${PKG_NAME}-v${PKG_VERSION}"
          TAG="${GITHUB_REF_NAME}"
          if [ "$EXPECTED_TAG" != "$TAG" ] && [ "$EXPECTED_COMPONENT_TAG" != "$TAG" ]; then
            echo "::error::package.json version (v${PKG_VERSION}) does not match release tag ($TAG)"
            exit 1
          fi

      - name: Publish
        run: npm publish --access public
